server_tokens off;                                                              
add_header X-Frame-Options SAMEORIGIN;                                          
add_header X-Content-Type-Options nosniff;                                      
add_header X-XSS-Protection "1; mode=block";                                    
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ssl.google-analytics.com https://assets.zendesk.com https://connect.facebook.net; img-src 'self' https://ssl.google-analytics.com https://s-static.ak.facebook.com https://assets.zendesk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.zendesk.com; font-src 'self' https://themes.googleusercontent.com; frame-src https://assets.zendesk.com https://www.facebook.com https://s-static.ak.facebook.com https://tautt.zendesk.com; object-src 'none'";

upstream web_app {                                                              
  server 127.0.0.1:1989;                                                        
}                                                                               
                                                                                
server {                                                                        
  listen 80;                                                                    
  listen [::]:80;                                                               
  server_name ~^(?!mqtt|lora|sigfox).*.sensum.co.nz;
  access_log /var/log/nginx/backend.sensum.co.nz.access.log;                    
  error_log /var/log/nginx/backend.sensum.co.nz.error.log debug;                
  location / {                                                                  
    proxy_set_header X-Real-IP $remote_addr;                                    
    proxy_set_header X-Forwarder-For $proxy_add_x_forwarded_for;                
    proxy_set_header Host $http_host;                                           
    proxy_set_header X-NginX-Proxy true;                                        
    proxy_pass http://web_app;                                                  
    proxy_redirect off;                                                         
    return 301 https://$host$request_uri;                                       
  }                                                                             
  location /lennon {                                                            
    proxy_set_header X-Real-IP $remote_addr;                                    
    proxy_set_header X-Forwarder-For $proxy_add_x_forwarded_for;                
    proxy_set_header Host $http_host;                                           
    proxy_set_header X-NginX-Proxy true;                                        
    proxy_pass http://127.0.0.1:1989/lennon;                                    
    proxy_redirect off;                                                         
  }                                                                             
}                                                                               
                                                                                
server {                                                                        
  listen 443 ssl http2;                                                         
  listen [::]:443 ssl http2;                                                    
  server_name ~^(?!mqtt|lora|sigfox).*.sensum.co.nz;
    ssl_certificate /etc/letsencrypt/live/backend.sensum.co.nz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backend.sensum.co.nz/privkey.pem; # managed by Certbot
  # enable session resumption to improve https performance                      
  # http://vincent.bernat.im/en/blog/2011-ssl-session-reuse-rfc5077.html        
  ssl_session_cache shared:SSL:50m;                                             
  ssl_session_timeout 1d;                                                       
  ssl_session_tickets off;                                                      
  # Diffie-Hellman parameter for DHE ciphersuites, recommended 2048 bits        
  #ssl_dhparam /etc/nginx/ssl/dhparam.pem;                                      
                                                                                
  # enables server-side protection from BEAST attacks                           
  # http://blog.ivanristic.com/2013/09/is-beast-still-a-threat.html             
  ssl_prefer_server_ciphers on;                                                 
  # disable SSLv3(enabled by default since nginx 0.8.19) since it's less secure then TLS http://en.wikipedia.org/wiki/Secure_Sockets_Layer#SSL_3.0
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;                                          
  # ciphers chosen for forward secrecy and compatibility                        
  # http://blog.ivanristic.com/2013/08/configuring-apache-nginx-and-openssl-for-forward-secrecy.html
  ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS';
  # enable ocsp stapling (mechanism by which a site can convey certificate revocation information to visitors in a privacy-preserving, scalable manner)
  # http://blog.mozilla.org/security/2013/07/29/ocsp-stapling-in-firefox/          
  #resolver 8.8.8.8 8.8.4.4;                                                    
  #ssl_stapling on;                                                             
  #ssl_stapling_verify on;                                                      
  #ssl_trusted_certificate /etc/nginx/ssl/star_forgott_com.crt;                 
                                                                                
  # config to enable HSTS(HTTP Strict Transport Security) https://developer.mozilla.org/en-US/docs/Security/HTTP_Strict_Transport_Security
  # to avoid ssl stripping https://en.wikipedia.org/wiki/SSL_stripping#SSL_stripping
  # also https://hstspreload.org/                                               
  add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
                                                                                
  access_log /var/log/nginx/backend.sensum.co.nz.access.log;                    
  error_log /var/log/nginx/backend.sensum.co.nz.error.log debug;                
  location / {                                                                  
    proxy_set_header X-Real-IP $remote_addr;                                    
    proxy_set_header X-Forwarder-For $proxy_add_x_forwarded_for;                
    proxy_set_header Host $http_host;                                           
    proxy_set_header X-NginX-Proxy true;                                        
    proxy_pass http://web_app;                                                  
    proxy_redirect off;                                                         
    proxy_http_version 1.1;                                                     
  }                                                                             









}

#MQTT OVER WEBSOCKETS CONFIGURATION
upstream mqtt_websocket {
  server 127.0.0.1:9002;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name mqtt.sensum.co.nz;
    ssl_certificate /etc/letsencrypt/live/backend.sensum.co.nz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backend.sensum.co.nz/privkey.pem; # managed by Certbot
  access_log /var/log/nginx/mqtt.sensum.co.nz.access.log;
  error_log /var/log/nginx/mqtt.sensum.co.nz.error.log;
  location / {
    proxy_pass https://mqtt_websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

}

