<div class="row">
	<div class="col-md-12">
		<div class="box">
			<div class="box-header">
				<h3 class="box-title">
					<i class="fa fa-fw fa-cubes"></i>
					{{'PROJECTS_LIST_TITLE' | translate}}
				</h3>
				<div class="pull-right box-tools">
					<a
						href="/dashboard/projects/add"
						class="btn btn-success btn-sm"
					>
						<i class="fa fa-plus fa-fw"></i>
						{{'PROJECTS_ADD_PROJECT' | translate}}
					</a>
				</div>
			</div>
			<div class="box-body no-padding">
				<table class="table table-bordered table-striped">
					<thead>
						<tr>
							<th ng-repeat="h in projects.CONF.headers track by $index">
								{{h.label[sensum.language]}}
							</th>
							<th>
								{{'PROJECTS_ACTIONS' | translate}}
							</th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="p in projects.projects track by $index">
							<td 
								ng-switch="h.type"
								ng-repeat="h in projects.CONF.headers track by $index"
							>
								<span 
									ng-switch-when='checkbox'
									class="label label-default text-uppercase"
								>
									{{projects.BOOLEAN[p[h.key]].key[sensum.language]}}
								</span>
								<small ng-switch-default>{{p[h.key]}}</small>
							</td>
							<td style="width:50px;" class="text-center">
								<a
									href="/dashboard/projects/edit/{{p.id_project}}"
									class="btn btn-primary btn-sm"
								>
									<i class="fa fa-pencil fa-fw"></i>{{'PROJECTS_EDIT' | translate}}
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>
