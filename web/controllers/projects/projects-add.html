<div class="row">
	<div class="col-md-4">
	</div>
	<div class="col-md-4">
		<form name="project_form">
		<div class="box">
			<div class="box-header">
				<h4 class="box-title">
					<i class="fa fa-plus fa-fw"></i>
					{{'PROJECTS_ADD_PROJECT' | translate}}
				</h4>
				<div class="pull-right box-tools">
					<div class="btn-group">
						<a
							class="btn btn-sm btn-primary"
							href="/dashboard/data/projects"
						>
							<i class="fa fa-cubes"></i>
						</a>
					</div>
				</div>
			</div>
			<div class="box-body">
				<div 
					ng-repeat="h in projects.CONF.headers track by $index"
					ng-switch="h.type"
					class="form-group"
				>
					<label>
						{{h.label[sensum.language]}}
					</label>					
					<select 
						class="form-control"
						ng-model="projects.project[h.key]"
						ng-options="r.value as r.key[sensum.language] for r in projects.BOOLEAN"
						ng-switch-when="checkbox"
						ng-required="true"
					></select>
					<div
						class="input-group"
						ng-switch-when="url"
					>
						<span class="input-group-addon text-bold">
							http://
						</span>
						<input 
							type="text"
							class="form-control"
							ng-model="projects.project[h.key]"
							ng-required="true"
						/>
					</div>
					<input 
						type="text"
						class="form-control"
						ng-model="projects.project[h.key]"
						ng-switch-default
						ng-required="true"
					/>
					<select 
						class="form-control"
						ng-model="projects.project[h.key]"
						ng-options="r[h.value] as r[h.display] for r in projects[h.source]"
						ng-switch-when="select"
						ng-required="true"
					></select>
				</div>
			</div>
			<div class="box-footer">
				<button
					class="btn btn-success btn-block"
					ng-click="projects.addProject()"
					ng-disabled="project_form.$invalid"
				>
					<i class="fa fa-plus fa-fw"></i>
					{{'PROJECTS_ADD_PROJECT' | translate}}
				</button>
			</div>
		</div>
		</form>
	</div>
</div>
