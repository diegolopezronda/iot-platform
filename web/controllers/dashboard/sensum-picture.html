<form name="{{form_name}}" enctype="multipart/form-data">
	<div class="form-group">
		<label>
			Choose your picture (maximum size {{size}}Mb)
		</label>
		<input 	
			id="{{form_name}}-input"
			class="hidden form-control"
			type="file"
			name="file"
			accept="{{accept}}"
		/>
		<div class="input-group">
			<div 
				style="height:34px;" 
				class="no-border progress form-control active no-padding"
				ng-show="is_uploading"
			>
				<div 
					class="progress-bar progress-bar-primary progress-bar-striped"
					role="progressbar"
					aria-valuenow="100" 
					aria-valuemin="0" 
					aria-valuemax="100" 
					style="width: 100%"
				>
					<span class="sr-only"></span>
				</div>
			</div>
			<span 
				class="form-control"
				ng-show="!is_uploading"
			>
				{{file_name}}
			</span>
			<div class="input-group-btn">	
				<button
					id="{{form_name}}-select"
					type="button"
					class="btn btn-primary btn-flat"
					ng-click="chooseFile()"
					ng-disabled="is_uploading"
				>
					<i class="fa fa-camera fa-fw"></i>
				</button>	
			</div>
			<div class="input-group-btn hidden">	
				<button
					type="button"
					class="btn btn-danger btn-flat"
					ng-click="file_name = null"
					ng-disabled="!file_name || is_uploading"
				>
					<i class="fa fa-times fa-fw"></i>
				</button>	
			</div>
			<div class="input-group-btn">	
				<button
					type="button"
					class="btn btn-success"
					ng-disabled="!file_name || is_uploading"
					ng-click="uploadFile()"
				>
					<i class="fa fa-upload fa-fw"></i>
				</button>	
			</div>
		</div>
	</div>
</form>
