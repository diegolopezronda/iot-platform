<div
	data-toggle="tooltip"
	data-html="true"
	title="
		Carrier:{{carrier}}<br/>
		SF:{{sf}}
	"
>
<span class="fa-stack fa-{{compact === false ? '2' : '1'}}x">
		<i class="fa fa-signal fa-stack-1x text-gray"></i>
		<i 
			class="fa fa-signal fa-stack-1x text-{{i.color}} sensum-no-overflow"
			ng-repeat="i in sensum.constants[indicator]"
			ng-style="i.style"
			ng-show="
				value > i.limits[carrier][sf].min && 
				value <= i.limits[carrier][sf].max
			"
		></i>
	</span>
	<br ng-show="compact === false"/>
	<span 
		ng-show="value" 
		class="label label-default"
	>
		{{value}}
	</span>
	<span 
		ng-show="!value" 
		class="label bg-purple text-uppercase"
	>
		Unknown
	</span>
</div>
