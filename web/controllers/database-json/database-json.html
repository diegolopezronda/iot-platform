<div class="row">
  <div class="col-md-12">
    <div class="box">
      <div class="box-header">
        <h3 class="box-title">Input</h3>
      </div>

      <div class="box-body">
        <textarea ng-model="database_json.input" ng-change=
        "database_json.convert()" class="form-control">
</textarea>
      </div>
    </div>

    <div class="box">
      <div class="box-header">
        <h3 class="box-title">Output</h3>
      </div>

      <div class="box-body">
        <textarea ng-model="database_json.output" class="form-control" readonly
        >
</textarea>
      </div>
    </div>
  </div>
</div>
